name: add-quartz-sprites
on:
  workflow_dispatch:
jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write quartz PNGs and update sprites.json
        run: |
          python3 << 'PY'
          import base64, json
          from pathlib import Path
          Path("public/sprites/npc/quartz-1.png").write_bytes(base64.b64decode(""))
          Path("public/sprites/npc/quartz-2.png").write_bytes(base64.b64decode(""))
          Path("public/sprites/npc/quartz-3.png").write_bytes(base64.b64decode(""))
          Path("public/sprites/npc/quartz-4.png").write_bytes(base64.b64decode(""))
          s = json.loads(Path("content/sprites.json").read_text())
          if "quartz" not in s["npcs"]:
              s["npcs"].append("quartz")
          Path("content/sprites.json").write_text(json.dumps(s, indent=2) + "\n")
          print("wrote quartz frames, npcs", s["npcs"][-3:])
          PY
      - name: Update CURRENT_WORK.md
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("CURRENT_WORK.md")
          t = p.read_text()
          t = t.replace("### 2. Crystal warden Quartz — unassigned", "### 2. Crystal warden Quartz — DONE (Grok C art)")
          if "Quartz NPC art" not in t:
              t = t.replace(
                  "Optional side content, not a story fork. Not named \"gym\". Art is Grok A.",
                  "Optional side content, not a story fork. Not named \"gym\".\n"
                  "Quartz NPC art (quartz-1..4.png) + sprites.json entry by Grok C (took Grok A art slot).",
              )
          p.write_text(t)
          print("CURRENT_WORK updated")
          PY
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add public/sprites/npc/quartz-*.png content/sprites.json CURRENT_WORK.md
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Add Quartz crystal warden NPC art (4 frames) and sprites.json entry"
          git push
