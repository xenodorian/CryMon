name: Deploy CryMon Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "content/**"
      - "ports/dreamcast/crymon.cdi"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static web app
        env:
          GITHUB_PAGES: "true"
          VITE_AUTH_ENABLED: "false"
        run: npx vite build

      - name: Package Dreamcast download
        run: |
          mkdir -p dist/client/rom
          if [ -f ports/dreamcast/crymon.cdi ]; then
            cp ports/dreamcast/crymon.cdi dist/client/rom/CryMon.cdi
          else
            echo "WARN: crymon.cdi missing; Pages ships without ROM slot"
            echo "CDI missing at build time" > dist/client/rom/README.txt
          fi

      - name: GitHub Pages SPA fallback
        run: cp dist/client/index.html dist/client/404.html

      - name: Verify web output
        run: |
          test -f dist/client/index.html
          test -f dist/client/404.html
          find dist/client -maxdepth 2 -type f | sort | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
