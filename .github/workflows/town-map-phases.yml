name: Town Map phases
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore generator from pre-placeholder + run Python port
        run: |
          set -e
          # Recover mjs if placeholder
          if grep -q '^PLACEHOLDER$' tools/generate-town-map.mjs 2>/dev/null; then
            git show fc96571a83:tools/generate-town-map.mjs > tools/generate-town-map.mjs || true
          fi
          # Write Python generator (Phases 0-4)
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request
          # Fetch the python generator committed in this workflow's companion file if present
          p = Path('tools/generate_town_map.py')
          if not p.exists() or p.stat().st_size < 1000:
              print('generator missing; will write inline in next step')
          PY
      - name: Install and run generator script from repo path
        run: |
          set -e
          if [ -f tools/generate_town_map.py ]; then
            python3 tools/generate_town_map.py
          else
            echo 'generate_town_map.py not on tree yet'
            exit 1
          fi
      - name: Commit outputs
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add content/town_map.json docs/generated/ tools/generate-town-map.mjs tools/generate_town_map.py CURRENT_WORK.md || true
          git status
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Town Map Phases 0-4: real route shapes, scaled layout, schema v3"
          git push
      - name: Ship Pages
        run: gh workflow run deploy-pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
