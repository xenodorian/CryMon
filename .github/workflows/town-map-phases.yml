name: Town Map phases
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate town_map v3 from real route geometry
        run: |
          set -e
          python3 << 'PY'
          import json
          from pathlib import Path
          ROOT = Path('.')
          layout = json.loads((ROOT/'content/world_map_layout.json').read_text())
          maps_pack = json.loads((ROOT/'content/maps.json').read_text())
          world_pack = json.loads((ROOT/'content/world.json').read_text())
          maps, rows = layout['maps'], maps_pack.get('rows') or {}
          solid = set(maps_pack.get('solid') or '#')
          warps = world_pack.get('warps') or []
          COLLAPSE = {'house':'veld','gauntlet1':'gauntlet_route','gauntlet2':'gauntlet_route','gauntlet3':'gauntlet_route','gauntlet4':'gauntlet_route','gauntlet5':'gauntlet_route','gauntlet6':'heavenfall_shrine','gauntlet':None}
          CHAIN = [f'gauntlet{i}' for i in range(1,6)]
          META = {
            'veld':('CryTown','town',True),'camp':('The Camp','camp',True),'grove':('The Grove','landmark',True),
            'reach':('The Reach','landmark',True),'heavenfall_shrine':('Heavenfall Shrine','shrine',True),
            'quarry':('The Quarry','cave',True),'forest':('The Forest','route',False),'cliffs':('The Cliffs','route',False),
            'marsh':('The Marsh','route',False),'ruins':('The Ruins','route',False),'gauntlet_route':('Gauntlet','route',False),
          }
          UNIT = 10
          def rid(m):
            if m in COLLAPSE: return COLLAPSE[m]
            mm = maps.get(m)
            if not mm or mm.get('active') is False: return None
            return m
          def msize(mid):
            r = rows.get(mid)
            if not r: return None
            return max(len(x) for x in r), len(r)
          def find(mid, ch):
            r = rows.get(mid)
            if not r or not ch: return None
            for y,row in enumerate(r):
              x = row.find(ch)
              if x >= 0: return x,y
            return None
          def extract(key):
            ids = list(CHAIN) if key=='gauntlet_route' else [key]
            anchors, total_len, tw, th = {}, 0, 0, 0
            for mid in ids:
              sz = msize(mid)
              if not sz: continue
              w,h = sz; tw=max(tw,w); th+=h; total_len += max(w,h)
              for wp in warps:
                if wp.get('from')==mid:
                  m = find(mid, wp.get('tile'))
                  if m: anchors[rid(wp.get('to')) or wp.get('to')] = {'col':m[0],'row':m[1],'mapId':mid}
                if wp.get('to')==mid:
                  m = find(mid, wp.get('spawn'))
                  if m: anchors.setdefault(rid(wp.get('from')) or wp.get('from'), {'col':m[0],'row':m[1],'mapId':mid})
            return {'id':key,'mapIds':ids,'width':tw,'height':th if key=='gauntlet_route' else (msize(ids[0]) or (0,th))[1],'lengthTiles':total_len,'anchors':anchors}
          shapes = {k: extract(k) for k,v in META.items() if v[1]=='route' and (k=='gauntlet_route' or k in rows)}
          def span(k):
            s = shapes.get(k)
            return max(1, round(s['lengthTiles']/UNIT)) if s else 1
          raw=[]
          for e in layout.get('connections') or []:
            a,b = rid(e['from']), rid(e['to'])
            if a and b and a!=b: raw.append({'from':a,'to':b,'direction':e.get('direction') or 'down','need':e.get('need')})
          seen, edges = set(), []
          for e in raw:
            k='|'.join(sorted([e['from'],e['to']]))
            if k in seen: continue
            seen.add(k); edges.append(e)
          nodes=set()
          for e in edges:
            nodes.add(e['from']); nodes.add(e['to'])
          for v in COLLAPSE.values():
            if v: nodes.add(v)
          fs,cs,ms,rs,gs = span('forest'),span('cliffs'),span('marsh'),span('ruins'),span('gauntlet_route')
          SEED = {
            'veld':(0,0),'camp':(-max(2,cs),0),'cliffs':(max(2,cs),0),'forest':(0,max(2,fs)),
            'marsh':(-max(2,ms),max(2,fs)),'quarry':(max(2,cs),max(2,cs//2+1)),
            'grove':(0,max(2,fs)+max(2,fs//2)),'ruins':(max(2,rs),max(2,fs)+max(2,fs//2)),
            'gauntlet_route':(0,max(2,fs)+max(2,fs//2)+max(2,min(gs,8))),
            'reach':(max(2,rs),max(2,fs)+max(2,fs//2)+max(2,rs//2)),
            'heavenfall_shrine':(0,max(2,fs)+max(2,fs//2)+max(2,min(gs,8))+max(2,min(gs//2,6))),
          }
          pos = {i:{'x':p[0],'y':p[1]} for i,p in SEED.items() if i in nodes}
          def ribbon(a,b):
            A,B = pos.get(a), pos.get(b)
            if not A or not B: return []
            pts=[[A['x'],A['y']]]
            route = a if META.get(a,(None,'route'))[1]=='route' else (b if META.get(b,(None,''))[1]=='route' else None)
            if route and span(route)>=3:
              pts.append([(A['x']+B['x'])/2, (A['y']+B['y'])/2])
            pts.append([B['x'],B['y']]); return pts
          nodes_out=[]
          for i,p in pos.items():
            lab,kind,gem = META.get(i,(i,'route',False))
            n={'id':i,'label':lab,'kind':kind,'gem':gem,'x':p['x'],'y':p['y'],'playableMaps':[m for m in maps if rid(m)==i]}
            if i in shapes:
              n['lengthTiles']=shapes[i]['lengthTiles']; n['realSize']={'width':shapes[i]['width'],'height':shapes[i]['height']}
            nodes_out.append(n)
          edges_out=[{'from':e['from'],'to':e['to'],'direction':e['direction'],'need':e['need'],'ribbon':ribbon(e['from'],e['to'])} for e in edges]
          nxs=[p['x'] for p in pos.values()]; nys=[p['y'] for p in pos.values()]
          tw = (max(nxs)-min(nxs)+1)*6+8; th=(max(nys)-min(nys)+1)*6+8
          town={
            'version':3,'name':layout.get('name') or 'Sorrow County','anchor':'veld',
            'playerStartMap':layout.get('playerMarker',{}).get('mapId') or 'veld','unitTiles':UNIT,
            'nodes':nodes_out,'edges':edges_out,
            'routeShapes':{i:{'id':s['id'],'mapIds':s['mapIds'],'width':s['width'],'height':s['height'],'lengthTiles':s['lengthTiles'],'anchors':s['anchors']} for i,s in shapes.items()},
            'collapse':COLLAPSE,'terrain':{'width':tw,'height':th,'tiles':['L'*tw for _ in range(th)]},
            'generatedFrom':{'layout':'content/world_map_layout.json','maps':'content/maps.json','warps':'content/world.json'},
          }
          (ROOT/'content/town_map.json').write_text(json.dumps(town, indent=2)+'\n')
          (ROOT/'docs/generated').mkdir(parents=True, exist_ok=True)
          (ROOT/'docs/generated/route-shape-audit.json').write_text(json.dumps({'routes':shapes,'positions':pos}, indent=2)+'\n')
          print('OK', {i:s['lengthTiles'] for i,s in shapes.items()})
          print('pos', pos)
          PY
          if grep -qx PLACEHOLDER tools/generate-town-map.mjs 2>/dev/null; then
            git show fc96571a83:tools/generate-town-map.mjs > tools/generate-town-map.mjs || true
          fi
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add content/town_map.json docs/generated/ tools/generate-town-map.mjs
          git status
          git diff --staged --quiet && exit 0
          git commit -m "Town Map Phases 0-4: real route shapes, scaled layout, schema v3"
          git push
      - name: Ship Pages
        run: gh workflow run deploy-pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
