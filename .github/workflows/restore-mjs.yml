name: Restore mjs
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git show fc96571a83:tools/generate-town-map.mjs > tools/generate-town-map.mjs
          wc -c tools/generate-town-map.mjs
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add tools/generate-town-map.mjs
          git commit -m "Restore generate-town-map.mjs from fc96571a (pre-placeholder)"
          git push
