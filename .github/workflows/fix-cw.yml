name: fix-cw
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_mercy_dc_save.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add ports/dreamcast/src/save.c
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Mercy 2.9.5: pack/unpack executed_mask in DC save.c (byte 145)"
          git push
