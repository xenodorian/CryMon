name: fix-cw
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply web mercy scream SFX
        run: python3 tools/patch_mercy_sfx_web.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add content/audio.json src/game/audio.ts src/game/engine.ts
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Mercy 2.9.5: web scream SFX on Execute"
          git push
