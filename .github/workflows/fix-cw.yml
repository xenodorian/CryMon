name: fix-cw
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wrap up Mercy 2.9
        run: python3 tools/patch_mercy_wrap.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add ports/dreamcast/src/main.c CURRENT_WORK.md
          git status
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Mercy 2.9 complete: DC hide executed on draw, dismiss lines, CURRENT_WORK"
          git push
