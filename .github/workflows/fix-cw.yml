name: fix-cw
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore CURRENT_WORK and mark CI closed
        run: |
          set -e
          git show fb272551ddc4aec90bb113f3f48f5ad785646de1:CURRENT_WORK.md > CURRENT_WORK.md
          python3 tools/mark_ci_closed.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add CURRENT_WORK.md
          git commit -m "Restore full CURRENT_WORK.md; mark CI Pages gap CLOSED"
          git push
