name: fix-cw
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_touch_input.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add src/game/input.ts src/components/crymon-app.tsx
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Input: snappier touch virtual buttons (pointerdown, faster d-pad repeat)"
          git push
