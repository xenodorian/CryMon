name: fix-cw
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_mercy_compile.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add ports/dreamcast/src/main.c
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Fix DC mercy compile: frand(lo,hi), foe.lv, drop talk()"
          git push
