name: Fix WinAll
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch WinAll
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/game/engine.ts')
          t = p.read_text()
          old = '''\t/** Dev Codes console (web preview only, see devPassAll above).\n\t *  Returns a short status string for the UI to display. */\n\tsubmitDevCode(raw: string): string {\n\t\tconst code = raw.trim().toLowerCase();\n\t\tif (code === "winall") {\n\t\t\tif (this.mode !== "battle" || !this.battle) return "WinAll: no battle in progress.";\n\t\t\tthis.devWinAll();\n\t\t\treturn "WinAll: battle won.";\n\t\t}\n\t\tif (code === "passall") {\n\t\t\tthis.devPassAll = true;\n\t\t\treturn "PassAll: all warp gates open, noclip on.";\n\t\t}\n\t\treturn `Unknown dev code: "${raw}"`;\n\t}\n\t/** Skips straight to the end of the current battle as a win, exactly\n\t *  as if every enemy CryMon had just fainted -- reuses finishWin()\n\t *  (trainer/story-flag handling, mercy prompts, XP) rather than\n\t *  faking a simpler ending, so it can't drift from a real win. */\n\tdevWinAll() {\n\t\tconst b = this.battle;\n\t\tif (!b) return;\n\t\tb.foe.hp = 0;\n\t\tb.foeBench = [];\n\t\tthis.finishWin();\n\t}'''
          new = '''\t/** Dev Codes console (web preview only, see devPassAll above).\n\t *  Returns a short status string for the UI to display. */\n\tsubmitDevCode(raw: string): string {\n\t\tconst code = raw.trim().toLowerCase();\n\t\tif (code === "winall") {\n\t\t\tif (this.mode === "battle" && this.battle) {\n\t\t\t\tthis.devWinAll();\n\t\t\t\treturn "WinAll: battle won.";\n\t\t\t}\n\t\t\tif (this.mode === "mercy" && this.battle) {\n\t\t\t\tthis.mode = "world";\n\t\t\t\tthis.battle = null;\n\t\t\t\tthis.world.encounterLock = 3;\n\t\t\t\tthis.onBattleOver();\n\t\t\t\treturn "WinAll: left mercy, battle cleared.";\n\t\t\t}\n\t\t\tthis.devWinAllFlags();\n\t\t\treturn "WinAll: all trainers cleared (use in battle to win one fight).";\n\t\t}\n\t\tif (code === "passall") {\n\t\t\tthis.devPassAll = true;\n\t\t\treturn "PassAll: all warp gates open, noclip on.";\n\t\t}\n\t\treturn `Unknown dev code: "${raw}"`;\n\t}\n\t/** Skips straight to the end of the current battle as a win, exactly\n\t *  as if every enemy CryMon had just fainted -- reuses finishWin()\n\t *  (trainer/story-flag handling, mercy prompts, XP) rather than\n\t *  faking a simpler ending, so it can't drift from a real win. */\n\tdevWinAll() {\n\t\tconst b = this.battle;\n\t\tif (!b) return;\n\t\tb.foe.hp = 0;\n\t\tb.foeBench = [];\n\t\tthis.finishWin();\n\t}\n\t/** Outside battle: mark every trainer/story flag beaten so the player\n\t *  can walk the full map without grinding (dev only). */\n\tdevWinAllFlags() {\n\t\tthis.beatCalder = true;\n\t\tthis.beatCathleen = true;\n\t\tthis.beatShinigami = true;\n\t\tthis.beatCross = true;\n\t\tthis.beatConscript = true;\n\t\tthis.beatEnforcer = true;\n\t\tthis.beatSentry = true;\n\t\tthis.beatForestRanger = true;\n\t\tthis.beatForestScout = true;\n\t\tthis.beatRuinsKeeper = true;\n\t\tthis.beatRuinsWarden = true;\n\t\tthis.beatMarshBog = true;\n\t\tthis.beatMarshReed = true;\n\t\tthis.badgeQuartz = true;\n\t\tthis.badgeOpal = true;\n\t\tthis.beatQuarryDriller = true;\n\t\tthis.beatCommander = true;\n\t\tthis.beatLieutenantLead = true;\n\t\tthis.beatHeavenfall = true;\n\t\tfor (const sol of this.soldiers) sol.beaten = true;\n\t}'''
          if old not in t:
              if 'devWinAllFlags' in t:
                  print('already patched')
              else:
                  raise SystemExit('block not found')
          else:
              p.write_text(t.replace(old, new, 1))
              print('patched')
          PY
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add src/game/engine.ts
          git commit -m "WinAll: works outside battle (clear all trainer flags); still wins active fights"
          git push
      - name: Ship Pages
        run: gh workflow run deploy-pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
