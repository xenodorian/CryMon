name: Town Map v4
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate v4 map
        run: |
          set -e
          python3 << 'PY'
          import json
          from pathlib import Path
          from collections import deque
          ROOT = Path('.')
          layout = json.loads((ROOT/'content/world_map_layout.json').read_text())
          maps_pack = json.loads((ROOT/'content/maps.json').read_text())
          maps, rows = layout['maps'], maps_pack.get('rows') or {}
          SCALE = 10
          COLLAPSE = {'house':'veld','gauntlet1':'gauntlet_route','gauntlet2':'gauntlet_route','gauntlet3':'gauntlet_route','gauntlet4':'gauntlet_route','gauntlet5':'gauntlet_route','gauntlet6':'heavenfall_shrine','gauntlet':None}
          CHAIN = [f'gauntlet{i}' for i in range(1,6)]
          META = {
            'veld':('CryTown','town',True),'camp':('The Camp','camp',True),'grove':('The Grove','landmark',True),
            'reach':('The Reach','landmark',True),'heavenfall_shrine':('Heavenfall Shrine','shrine',True),
            'quarry':('The Quarry','cave',True),'forest':('The Forest','route',False),'cliffs':('The Cliffs','route',False),
            'marsh':('The Marsh','route',False),'ruins':('The Ruins','route',False),'gauntlet_route':('Gauntlet','route',False),
          }
          def rid(m):
            if m in COLLAPSE: return COLLAPSE[m]
            mm = maps.get(m)
            if not mm or mm.get('active') is False: return None
            return m
          def msize(mid):
            r = rows.get(mid)
            if not r: return None
            return max(len(x) for x in r), len(r)
          def cell_size(key):
            if key == 'gauntlet_route':
              w=h=0
              for mid in CHAIN:
                sz=msize(mid)
                if not sz: continue
                w=max(w,sz[0]); h+=sz[1]
              return max(1,round(w/SCALE)), max(1,round(h/SCALE))
            if key == 'heavenfall_shrine':
              sz=msize('gauntlet6') or (16,20)
              return max(1,round(sz[0]/SCALE)), max(1,round(sz[1]/SCALE))
            sz=msize(key)
            if not sz:
              for m in rows:
                if rid(m)==key and msize(m):
                  sz=msize(m); break
            if not sz: return 1,1
            return max(1,round(sz[0]/SCALE)), max(1,round(sz[1]/SCALE))
          def exit_edge(fmap, xy):
            sz=msize(fmap)
            if not sz or not xy: return 'south'
            w,h=sz; x,y=xy.get('x',0),xy.get('y',0)
            d={'west':x,'east':w-1-x,'north':y,'south':h-1-y}
            return min(d, key=d.get)
          sizes={k:cell_size(k) for k in META}
          assert sizes['veld']==(3,2), sizes['veld']
          assert sizes['cliffs']==(2,1), sizes['cliffs']
          region_edges=[]; seen=set()
          for c in layout.get('connections') or []:
            a,b=rid(c['from']),rid(c['to'])
            if not a or not b or a==b: continue
            k=tuple(sorted([a,b]))
            if k in seen: continue
            seen.add(k)
            region_edges.append({'from':a,'to':b,'edge':exit_edge(c['from'],c.get('fromXY')),'src':c})
          boxes={}
          def occupies(x,y,w,h):
            for b in boxes.values():
              if x<b['x']+b['w'] and x+w>b['x'] and y<b['y']+b['h'] and y+h>b['y']: return True
            return False
          def place_flush(parent, child, edge, align_t=0.5):
            if child in boxes: return
            pw,ph=sizes[parent]; cw,ch=sizes[child]; p=boxes[parent]
            candidates=[]
            if edge=='east':
              preferred_y=p['y']+int(round(align_t*max(0,ph-1)))-ch//2
              candidates.append((p['x']+p['w'], preferred_y))
              for dy in range(-(ch-1), ph): candidates.append((p['x']+p['w'], p['y']+dy))
            elif edge=='west':
              preferred_y=p['y']+int(round(align_t*max(0,ph-1)))-ch//2
              candidates.append((p['x']-cw, preferred_y))
              for dy in range(-(ch-1), ph): candidates.append((p['x']-cw, p['y']+dy))
            elif edge=='south':
              preferred_x=p['x']+int(round(align_t*max(0,pw-1)))-cw//2
              candidates.append((preferred_x, p['y']+p['h']))
              for dx in range(-(cw-1), pw): candidates.append((p['x']+dx, p['y']+p['h']))
            else:
              preferred_x=p['x']+int(round(align_t*max(0,pw-1)))-cw//2
              candidates.append((preferred_x, p['y']-ch))
              for dx in range(-(cw-1), pw): candidates.append((p['x']+dx, p['y']-ch))
            for x,y in candidates:
              if not occupies(x,y,cw,ch):
                boxes[child]={'x':x,'y':y,'w':cw,'h':ch}; return
            boxes[child]={'x':candidates[0][0],'y':candidates[0][1],'w':cw,'h':ch}
          vw,vh=sizes['veld']
          boxes['veld']={'x':0,'y':0,'w':vw,'h':vh}
          q=deque(['veld']); placed={'veld'}
          def align_frac(c):
            fmap=c.get('from'); xy=c.get('fromXY') or {}; sz=msize(fmap)
            if not sz: return 0.5
            w,h=sz; x,y=xy.get('x',w/2),xy.get('y',h/2)
            edge=exit_edge(fmap,xy)
            return (y/max(1,h-1)) if edge in ('east','west') else (x/max(1,w-1))
          while q:
            cur=q.popleft()
            for e in region_edges:
              if e['from']==cur and e['to'] not in placed:
                place_flush(cur,e['to'],e['edge'],align_frac(e['src'])); placed.add(e['to']); q.append(e['to'])
              elif e['to']==cur and e['from'] not in placed:
                inv={'east':'west','west':'east','south':'north','north':'south'}[e['edge']]
                place_flush(cur,e['from'],inv,0.5); placed.add(e['from']); q.append(e['from'])
          for k in META:
            if k not in boxes:
              w,h=sizes[k]; max_y=max(b['y']+b['h'] for b in boxes.values())
              boxes[k]={'x':0,'y':max_y,'w':w,'h':h}
          assert boxes['cliffs']['x']==boxes['veld']['x']+boxes['veld']['w']
          min_x=min(b['x'] for b in boxes.values()); min_y=min(b['y'] for b in boxes.values())
          for b in boxes.values():
            b['x']-=min_x; b['y']-=min_y
          max_x=max(b['x']+b['w'] for b in boxes.values()); max_y=max(b['y']+b['h'] for b in boxes.values())
          M=2; gw,gh=max_x+M*2, max_y+M*2
          grid=[['W']*gw for _ in range(gh)]
          for i,b in boxes.items():
            for dy in range(b['h']):
              for dx in range(b['w']):
                x,y=M+b['x']+dx, M+b['y']+dy
                if 0<=x<gw and 0<=y<gh: grid[y][x]='R'
          nodes_out=[]
          for i,b in boxes.items():
            lab,kind,gem=META[i]
            if i=='gauntlet_route': rw,rh=16,180
            elif i=='heavenfall_shrine': rw,rh=msize('gauntlet6') or (16,20)
            else: rw,rh=msize(i) or (b['w']*SCALE,b['h']*SCALE)
            nodes_out.append({'id':i,'label':lab,'kind':kind,'gem':gem,'x':b['x'],'y':b['y'],'cellW':b['w'],'cellH':b['h'],'playableMaps':[m for m in maps if rid(m)==i],'realSize':{'width':rw,'height':rh}})
          edges_out=[{'from':e['from'],'to':e['to'],'edge':e['edge'],'need':e['src'].get('need')} for e in region_edges if e['from'] in boxes and e['to'] in boxes]
          town={'version':4,'name':layout.get('name') or 'Sorrow County','anchor':'veld','playerStartMap':layout.get('playerMarker',{}).get('mapId') or 'veld','scale':SCALE,'scaleNote':'1 cell = 10 real tiles (CryTown 30x23 -> 3x2)','nodes':nodes_out,'edges':edges_out,'collapse':COLLAPSE,'terrain':{'width':gw,'height':gh,'tiles':[''.join(r) for r in grid]},'generatedFrom':{'layout':'content/world_map_layout.json','maps':'content/maps.json'}}
          (ROOT/'content/town_map.json').write_text(json.dumps(town,indent=2)+'\n')
          CELL=16; sw,sh=gw*CELL+40, gh*CELL+40
          svg=['<?xml version="1.0" encoding="UTF-8"?>',f'<svg xmlns="http://www.w3.org/2000/svg" width="{sw}" height="{sh}" viewBox="0 0 {sw} {sh}">',f'<rect width="100%" height="100%" fill="#0d1b2a"/>']
          ox,oy=20,20
          for y in range(gh):
            for x in range(gw):
              if grid[y][x]=='W': continue
              svg.append(f'<rect x="{ox+x*CELL}" y="{oy+y*CELL}" width="{CELL}" height="{CELL}" fill="#c4a574" stroke="#a08050" stroke-width="0.5"/>')
          for i,b in boxes.items():
            lab,kind,gem=META[i]
            cx=ox+(M+b['x']+b['w']/2)*CELL; cy=oy+(M+b['y'])*CELL-3
            svg.append(f'<text x="{cx}" y="{cy}" text-anchor="middle" fill="#f0e8c8" font-family="monospace" font-size="9">{lab}</text>')
            if gem:
              gx=ox+(M+b['x']+b['w']/2)*CELL; gy=oy+(M+b['y']+b['h']/2)*CELL
              svg.append(f'<circle cx="{gx}" cy="{gy}" r="4" fill="#1a4a6a"/>')
              svg.append(f'<path d="M {gx} {gy-3.5} L {gx+3} {gy} L {gx} {gy+3.5} L {gx-3} {gy} Z" fill="#7ec8f0"/>')
          svg.append('</svg>')
          (ROOT/'public/maps').mkdir(parents=True, exist_ok=True)
          (ROOT/'public/maps/sorrow-county-town-map.svg').write_text('\n'.join(svg)+'\n')
          print('OK', {k:(boxes[k]['w'],boxes[k]['h'],boxes[k]['x'],boxes[k]['y']) for k in boxes})
          PY
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert -background '#0d1b2a' public/maps/sorrow-county-town-map.svg public/maps/sorrow-county-town-map.png
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add content/town_map.json public/maps/
          git commit -m "Town Map v4: proportional cells (CryTown 3x2, Cliffs 2x1 flush), no path padding"
          git push
      - name: Ship Pages
        run: gh workflow run deploy-pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
