name: Build Dreamcast CDI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake content
        run: python3 tools/bake_content.py --content content --out ports/dreamcast/src
      - name: Generate sprites
        run: python3 ports/dreamcast/tools/gen_sprites.py public/sprites
      - name: Build ELF and CDI
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/src"             -w /src             einsteinx2/dcdev-kos-toolchain:gcc-9             sh -lc 'make -C ports/dreamcast clean && make -C ports/dreamcast && cdi4dc ports/dreamcast/crymon.elf ports/dreamcast/crymon.cdi'
      - name: Verify outputs
        run: |
          file ports/dreamcast/crymon.elf
          file ports/dreamcast/crymon.cdi
          ls -lh ports/dreamcast/crymon.elf ports/dreamcast/crymon.cdi
      - name: Commit CDI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ports/dreamcast/src/content_*.inc ports/dreamcast/src/sprites.h ports/dreamcast/crymon.elf ports/dreamcast/crymon.cdi
          git diff --cached --quiet || git commit -m "Build Dreamcast CDI"
          git push
