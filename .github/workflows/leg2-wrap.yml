name: Leg 2 wrap
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_lead_speaker.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add content/dialogue.json src/game/types.ts ports/dreamcast/src \
            tools/bake_content.py tools/patch_lead_speaker.py
          git status
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Speaker map: lead/system in dialogue + bake SPEAKER; rebake"
          git push
      - name: Ship Pages + CDI
        run: |
          gh workflow run deploy-pages.yml --ref main || true
          gh workflow run build-dreamcast.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
