name: Install Lead HQ sprites
on:
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow numpy -q
      - name: Install sprites from sheet
        run: python3 tools/patches/install_lead_from_sheet.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add public/sprites/npc/lead-*.png public/sprites/monsters/lead/ public/sprites/portraits/lead.png
          git commit -m "Lieutenant Lead: HQ pixel art from reference sheet (OW, battle, portrait)" || exit 0
          git push
      - name: Deploy Pages
        run: gh workflow run deploy-pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
