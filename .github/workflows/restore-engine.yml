name: restore-engine
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore dialogue and add Opal
        run: |
          python3 << 'PY'
          import json, subprocess
          from pathlib import Path
          # last good full dialogue before truncate commit 184a9f83
          raw = subprocess.check_output(
              ["git", "show", "184a9f837ebec316515106488c7a45759e7754f5^:content/dialogue.json"],
              text=True,
          )
          d = json.loads(raw)
          assert len(d.get("talk", {})) > 50, len(d.get("talk", {}))
          d["speakers"]["opal"] = "Opal"
          d["talk"]["opalSpot"] = [
              {"speaker": "opal", "text": "Another crystal answers the Reach. Stand, if you mean to pass."},
              {"speaker": "max", "text": "I mean to. I will not turn back."},
          ]
          d["talk"]["opalWin"] = [
              {"speaker": "opal", "text": "The stone keeps your name. Walk on."},
          ]
          Path("content/dialogue.json").write_text(json.dumps(d, separators=(",", ":"), ensure_ascii=False) + "\n")
          print("talk", len(d["talk"]), "opal", "opalSpot" in d["talk"], "quarryLocked", "quarryLocked" in d["talk"])
          PY
      - name: Commit and push
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add content/dialogue.json
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Task 3.5: restore full dialogue.json + Opal speaker/talk"
          git push
