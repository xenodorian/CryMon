name: restore-engine
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Dreamcast PENDING for marsh/opal
        run: python3 tools/patch_pending_dc.py
      - name: Rebake if possible
        run: python3 tools/bake_content.py || echo bake skipped
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add tools/bake_content.py ports/dreamcast/src/main.c CURRENT_WORK.md ports/dreamcast/src/content_*.inc 2>/dev/null || true
          git add tools/bake_content.py ports/dreamcast/src/main.c CURRENT_WORK.md
          git status
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Dreamcast PENDING: marshBog, marshReed, opal dispatch + kit_keys"
          git push
