name: restore-engine
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install pillow
      - name: Generate opal frames, sync parts, mark Opal done
        run: |
          python3 << 'PY'
          import json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw

          out = Path("public/sprites/npc")
          out.mkdir(parents=True, exist_ok=True)
          W, H = 48, 64

          def frame(n):
              im = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              bob = [0, -1, 0, 1][n - 1]
              leg = [0, 1, 0, -1][n - 1]
              skin = (232, 210, 190, 255)
              hair = (255, 236, 220, 255)
              robe = (250, 245, 240, 255)
              robe_sh = (220, 200, 190, 255)
              accent = (255, 140, 160, 255)
              accent2 = (180, 220, 200, 255)
              gold = (220, 180, 90, 255)
              eye = (80, 60, 70, 255)
              outline = (60, 45, 50, 255)
              d.rectangle([18, 44 + bob, 22, 58 + bob + leg], fill=robe_sh, outline=outline)
              d.rectangle([26, 44 + bob, 30, 58 + bob - leg], fill=robe_sh, outline=outline)
              d.rectangle([16, 56 + bob + leg, 23, 60 + bob + leg], fill=outline)
              d.rectangle([25, 56 + bob - leg, 32, 60 + bob - leg], fill=outline)
              d.ellipse([14, 28 + bob, 34, 50 + bob], fill=robe, outline=outline)
              d.rectangle([16, 32 + bob, 32, 48 + bob], fill=robe)
              d.line([(16, 46 + bob), (32, 46 + bob)], fill=gold, width=1)
              arm = [0, 1, 0, -1][n - 1]
              d.rectangle([11, 30 + bob, 15, 42 + bob + arm], fill=robe, outline=outline)
              d.rectangle([33, 30 + bob, 37, 42 + bob - arm], fill=robe, outline=outline)
              d.ellipse([16, 10 + bob, 32, 28 + bob], fill=skin, outline=outline)
              d.ellipse([15, 8 + bob, 33, 20 + bob], fill=hair, outline=outline)
              d.rectangle([15, 14 + bob, 18, 24 + bob], fill=hair)
              d.rectangle([30, 14 + bob, 33, 24 + bob], fill=hair)
              d.point([(20, 18 + bob), (28, 18 + bob)], fill=eye)
              d.polygon([(24, 34 + bob), (21, 38 + bob), (24, 42 + bob), (27, 38 + bob)], fill=accent, outline=outline)
              d.point([(24, 37 + bob)], fill=accent2)
              d.ellipse([12, 28 + bob, 16, 32 + bob], fill=accent2, outline=outline)
              d.ellipse([32, 28 + bob, 36, 32 + bob], fill=accent, outline=outline)
              d.line([(36, 28 + bob), (38, 18 + bob)], fill=gold, width=2)
              d.ellipse([36, 14 + bob, 42, 20 + bob], fill=accent, outline=outline)
              path = out / f"opal-{n}.png"
              im.save(path, format="PNG")
              im2 = Image.open(path)
              im2.load()
              assert im2.size == (48, 64)
              print("wrote", path, path.stat().st_size)

          for i in range(1, 5):
              frame(i)

          sp = Path("content/sprites.json")
          s = json.loads(sp.read_text())
          if "opal" not in s["npcs"]:
              s["npcs"].append("opal")
              sp.write_text(json.dumps(s, indent=2) + "\n")

          w = json.loads(Path("content/world.json").read_text())
          t = json.loads(Path("content/world_parts/trainers.json").read_text())
          n = json.loads(Path("content/world_parts/npcs.json").read_text())
          if "quarryDriller" not in t["trainers"] and "quarryDriller" in w["trainers"]:
              t["trainers"]["quarryDriller"] = w["trainers"]["quarryDriller"]
              Path("content/world_parts/trainers.json").write_text(json.dumps(t, indent=2) + "\n")
              print("parts trainers +quarryDriller")
          if not any(x.get("id") == "quarryDriller" for x in n["npcs"]):
              qd = next(x for x in w["npcs"] if x.get("id") == "quarryDriller")
              n["npcs"].append(qd)
              Path("content/world_parts/npcs.json").write_text(json.dumps(n, indent=2) + "\n")
              print("parts npcs +quarryDriller")

          subprocess.check_call(["python3", "tools/merge_world.py"])
          w2 = json.loads(Path("content/world.json").read_text())
          assert "quarryDriller" in w2["trainers"]
          assert any(x.get("id") == "crystalOpal" for x in w2["npcs"])
          print("merge ok", len(w2["npcs"]), len(w2["trainers"]))

          p = Path("CURRENT_WORK.md")
          text = p.read_text()
          old = "### 3. Crystal warden Opal — unassigned\nSame as Quartz with `badgeOpal`. Second of the two wardens."
          new = (
              "### 3. Crystal warden Opal — DONE (Grok C)\n"
              "JSON + badgeOpal + Reach mark O + dialogue + engine flags + opal-1..4 art.\n"
              "Dreamcast PENDING dispatch still thin (Claude noted for marsh/opal)."
          )
          if old in text:
              text = text.replace(old, new)
          text = text.replace(
              "Quartz warden art + JSON draw live. Opal still open. Overworld NPC blit is JSON-driven.",
              "Quartz + Opal wardens live (web). Overworld NPC blit is JSON-driven. Quarry Driller wired by Claude A.",
          )
          p.write_text(text)
          print("CURRENT_WORK updated")
          PY
      - name: Commit and push
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add public/sprites/npc/opal-1.png public/sprites/npc/opal-2.png public/sprites/npc/opal-3.png public/sprites/npc/opal-4.png \
            content/sprites.json content/world_parts/trainers.json content/world_parts/npcs.json content/world.json CURRENT_WORK.md
          git status
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Restore valid opal-1..4; sync quarryDriller into world_parts; mark Opal DONE"
          git push
