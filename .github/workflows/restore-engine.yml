name: restore-engine
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Merge world from parts
        run: |
          python3 tools/merge_world.py
          python3 -c "import json; w=json.load(open('content/world.json')); assert 'opal' in w['trainers']; assert any(n.get('id')=='crystalOpal' for n in w['npcs']); print('ok', len(w['npcs']), len(w['trainers']))"
      - name: Commit and push
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add content/world.json
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Task 3.6: merge world.json from parts (Opal + crystalOpal)"
          git push
