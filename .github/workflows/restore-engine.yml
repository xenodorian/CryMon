name: restore-engine
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire marsh/opal Dreamcast PENDING dispatch
        run: |
          python3 << 'PY'
          from pathlib import Path

          # --- bake_content.py ---
          bake = Path("tools/bake_content.py").read_text()
          old_kits = '''kit_keys = ["sentry", "conscript", "enforcer", "cross",
                "forestRanger", "forestScout", "ruinsKeeper", "ruinsWarden", "quartz",
                "quarryDriller"]'''
          new_kits = '''kit_keys = ["sentry", "conscript", "enforcer", "cross",
                "forestRanger", "forestScout", "ruinsKeeper", "ruinsWarden", "quartz",
                "quarryDriller", "marshBog", "marshReed", "opal"]'''
          if "marshBog" not in bake or '"marshBog", "marshReed", "opal"]' not in bake.replace(" ",""):
              if old_kits in bake:
                  bake = bake.replace(old_kits, new_kits)
              else:
                  # tolerant: append missing keys before closing bracket of kit_keys list
                  if '"quarryDriller"]' in bake and "marshBog" not in bake.split("kit_keys")[1][:400]:
                      bake = bake.replace('"quarryDriller"]', '"quarryDriller", "marshBog", "marshReed", "opal"]', 1)
          # NPC_PENDING defines emitted by bake
          if "NPC_PENDING_MARSH_BOG" not in bake:
              bake = bake.replace(
                  'lines.append("#define NPC_PENDING_QUARRY_DRILLER 12")',
                  'lines.append("#define NPC_PENDING_QUARRY_DRILLER 12")\n'
                  '    lines.append("#define NPC_PENDING_MARSH_BOG 9")\n'
                  '    lines.append("#define NPC_PENDING_MARSH_REED 10")\n'
                  '    lines.append("#define NPC_PENDING_OPAL 11")',
              )
          Path("tools/bake_content.py").write_text(bake)
          print("bake_content patched")

          # --- main.c ---
          main = Path("ports/dreamcast/src/main.c").read_text()
          if "TRAINER_WSOLDIER_OPAL" in main and "beat_marsh_bog" in main:
              print("main.c already has marsh/opal")
          else:
              main = main.replace(
                  "#define TRAINER_WSOLDIER_QUARRY_DRILLER 15\n",
                  "#define TRAINER_WSOLDIER_QUARRY_DRILLER 15\n"
                  "#define TRAINER_WSOLDIER_OPAL 16\n"
                  "#define TRAINER_WSOLDIER_MARSH_BOG 17\n"
                  "#define TRAINER_WSOLDIER_MARSH_REED 18\n",
              )
              main = main.replace(
                  "#define POST_WSOLDIER_QUARRY_DRILLER 23\n",
                  "#define POST_WSOLDIER_QUARRY_DRILLER 23\n"
                  "#define POST_WSOLDIER_OPAL 24\n"
                  "#define POST_WSOLDIER_MARSH_BOG 25\n"
                  "#define POST_WSOLDIER_MARSH_REED 26\n",
              )
              main = main.replace(
                  "int beat_ruins_keeper = 0, beat_ruins_warden = 0, badge_quartz = 0;\n    int beat_quarry_driller = 0;\n",
                  "int beat_ruins_keeper = 0, beat_ruins_warden = 0, badge_quartz = 0;\n"
                  "    int beat_quarry_driller = 0;\n"
                  "    int beat_marsh_bog = 0, beat_marsh_reed = 0, badge_opal = 0;\n",
              )
              main = main.replace(
                  "ft[FLAG_BEAT_QUARRY_DRILLER] = &beat_quarry_driller;\n",
                  "ft[FLAG_BEAT_QUARRY_DRILLER] = &beat_quarry_driller;\n"
                  "        ft[FLAG_BEAT_MARSH_BOG] = &beat_marsh_bog;\n"
                  "        ft[FLAG_BEAT_MARSH_REED] = &beat_marsh_reed;\n"
                  "        ft[FLAG_BADGE_OPAL] = &badge_opal;\n",
              )
              # load
              if "SAVE_FLAG_BEAT_MARSH_BOG" not in main:
                  main = main.replace(
                      "beat_quarry_driller = save_flag_get(&sl, SAVE_FLAG_BEAT_QUARRY_DRILLER);\n",
                      "beat_quarry_driller = save_flag_get(&sl, SAVE_FLAG_BEAT_QUARRY_DRILLER);\n"
                      "                        beat_marsh_bog = save_flag_get(&sl, SAVE_FLAG_BEAT_MARSH_BOG);\n"
                      "                        beat_marsh_reed = save_flag_get(&sl, SAVE_FLAG_BEAT_MARSH_REED);\n"
                      "                        badge_opal = save_flag_get(&sl, SAVE_FLAG_BADGE_OPAL);\n",
                  )
              # reset
              main = main.replace(
                  "beat_ruins_keeper = 0; beat_ruins_warden = 0; badge_quartz = 0;\n                beat_quarry_driller = 0;\n",
                  "beat_ruins_keeper = 0; beat_ruins_warden = 0; badge_quartz = 0;\n"
                  "                beat_quarry_driller = 0;\n"
                  "                beat_marsh_bog = 0; beat_marsh_reed = 0; badge_opal = 0;\n",
              )
              # persist
              if "SAVE_FLAG_BEAT_MARSH_BOG" not in main or main.count("SAVE_FLAG_BEAT_MARSH_BOG") < 2:
                  main = main.replace(
                      "save_flag_put(&sl, SAVE_FLAG_BEAT_QUARRY_DRILLER, beat_quarry_driller);\n",
                      "save_flag_put(&sl, SAVE_FLAG_BEAT_QUARRY_DRILLER, beat_quarry_driller);\n"
                      "                    save_flag_put(&sl, SAVE_FLAG_BEAT_MARSH_BOG, beat_marsh_bog);\n"
                      "                    save_flag_put(&sl, SAVE_FLAG_BEAT_MARSH_REED, beat_marsh_reed);\n"
                      "                    save_flag_put(&sl, SAVE_FLAG_BADGE_OPAL, badge_opal);\n",
                  )
              # win handlers
              if "TRAINER_WSOLDIER_OPAL)" not in main:
                  main = main.replace(
                      "else if(battle.trainer_kind == TRAINER_WSOLDIER_QUARRY_DRILLER) {\n"
                      "                                    beat_quarry_driller = 1;\n"
                      "                                    marks += 15;\n"
                      "                                    battles++;\n"
                      "                                    in_battle = 0;\n"
                      "                                    enc_lock = 3;\n"
                      "                                    seq_lines = TALK_QUARRY_DRILLER_WIN;\n"
                      "                                    seq_len = TALK_LEN(TALK_QUARRY_DRILLER_WIN);\n"
                      "                                    seq_beat = 0;\n"
                      "                                    post_action = POST_NONE;\n"
                      "                                }\n",
                      "else if(battle.trainer_kind == TRAINER_WSOLDIER_QUARRY_DRILLER) {\n"
                      "                                    beat_quarry_driller = 1;\n"
                      "                                    marks += 15;\n"
                      "                                    battles++;\n"
                      "                                    in_battle = 0;\n"
                      "                                    enc_lock = 3;\n"
                      "                                    seq_lines = TALK_QUARRY_DRILLER_WIN;\n"
                      "                                    seq_len = TALK_LEN(TALK_QUARRY_DRILLER_WIN);\n"
                      "                                    seq_beat = 0;\n"
                      "                                    post_action = POST_NONE;\n"
                      "                                }\n"
                      "                                else if(battle.trainer_kind == TRAINER_WSOLDIER_OPAL) {\n"
                      "                                    badge_opal = 1;\n"
                      "                                    marks += 17;\n"
                      "                                    battles++;\n"
                      "                                    in_battle = 0;\n"
                      "                                    enc_lock = 3;\n"
                      "                                    seq_lines = TALK_OPAL_WIN;\n"
                      "                                    seq_len = TALK_LEN(TALK_OPAL_WIN);\n"
                      "                                    seq_beat = 0;\n"
                      "                                    post_action = POST_NONE;\n"
                      "                                }\n"
                      "                                else if(battle.trainer_kind == TRAINER_WSOLDIER_MARSH_BOG) {\n"
                      "                                    beat_marsh_bog = 1;\n"
                      "                                    marks += 11;\n"
                      "                                    battles++;\n"
                      "                                    in_battle = 0;\n"
                      "                                    enc_lock = 3;\n"
                      "                                    seq_lines = TALK_MARSH_BOG_WIN;\n"
                      "                                    seq_len = TALK_LEN(TALK_MARSH_BOG_WIN);\n"
                      "                                    seq_beat = 0;\n"
                      "                                    post_action = POST_NONE;\n"
                      "                                }\n"
                      "                                else if(battle.trainer_kind == TRAINER_WSOLDIER_MARSH_REED) {\n"
                      "                                    beat_marsh_reed = 1;\n"
                      "                                    marks += 12;\n"
                      "                                    battles++;\n"
                      "                                    in_battle = 0;\n"
                      "                                    enc_lock = 3;\n"
                      "                                    seq_lines = TALK_MARSH_REED_WIN;\n"
                      "                                    seq_len = TALK_LEN(TALK_MARSH_REED_WIN);\n"
                      "                                    seq_beat = 0;\n"
                      "                                    post_action = POST_NONE;\n"
                      "                                }\n",
                  )
              # battle setup cases after QUARRY_DRILLER break
              if "POST_WSOLDIER_OPAL:" not in main:
                  insert = '''                                case POST_WSOLDIER_OPAL:
                                    battle.foe = mint_monster(TRAINER_KITS[KIT_OPAL].lead_sp, TRAINER_KITS[KIT_OPAL].lead_lv);
                                    battle.wild = 0;
                                    battle.trainer_kind = TRAINER_WSOLDIER_OPAL;
                                    battle.phase = 0;
                                    { int n = s_cat(battle.msg[0], 0, "OPAL SENDS GLASSWISP");
                                      battle.msg[0][n] = 0; }
                                    battle.msg_n = 1; battle.msg_i = 0; battle.after = BAFTER_ITEM;
                                    battle.cur = 0;
                                    battle.mods_self_str = battle.mods_self_agl = battle.mods_self_spc = 0;
                                    battle.mods_foe_str = battle.mods_foe_agl = battle.mods_foe_spc = 0;
                                    battle.pend_str = battle.pend_agl = battle.pend_spc = 0;
                                    battle.pl_poisoned = battle.foe_poisoned = 0;
                                    battle.bench[0] = mint_monster(TRAINER_KITS[KIT_OPAL].bench_sp[0], TRAINER_KITS[KIT_OPAL].bench_lv[0]);
                                    battle.bench[1] = mint_monster(TRAINER_KITS[KIT_OPAL].bench_sp[1], TRAINER_KITS[KIT_OPAL].bench_lv[1]);
                                    battle.bench_n = TRAINER_KITS[KIT_OPAL].bench_n;
                                    battle.grew = 0;
                                    battle.pl = party[lead];
                                    in_battle = 1;
                                    break;
                                case POST_WSOLDIER_MARSH_BOG:
                                    battle.foe = mint_monster(TRAINER_KITS[KIT_MARSH_BOG].lead_sp, TRAINER_KITS[KIT_MARSH_BOG].lead_lv);
                                    battle.wild = 0;
                                    battle.trainer_kind = TRAINER_WSOLDIER_MARSH_BOG;
                                    battle.phase = 0;
                                    { int n = s_cat(battle.msg[0], 0, "BOGWALKER SENDS PEATLING");
                                      battle.msg[0][n] = 0; }
                                    battle.msg_n = 1; battle.msg_i = 0; battle.after = BAFTER_ITEM;
                                    battle.cur = 0;
                                    battle.mods_self_str = battle.mods_self_agl = battle.mods_self_spc = 0;
                                    battle.mods_foe_str = battle.mods_foe_agl = battle.mods_foe_spc = 0;
                                    battle.pend_str = battle.pend_agl = battle.pend_spc = 0;
                                    battle.pl_poisoned = battle.foe_poisoned = 0;
                                    battle.bench[0] = mint_monster(TRAINER_KITS[KIT_MARSH_BOG].bench_sp[0], TRAINER_KITS[KIT_MARSH_BOG].bench_lv[0]);
                                    battle.bench[1] = mint_monster(TRAINER_KITS[KIT_MARSH_BOG].bench_sp[1], TRAINER_KITS[KIT_MARSH_BOG].bench_lv[1]);
                                    battle.bench_n = TRAINER_KITS[KIT_MARSH_BOG].bench_n;
                                    battle.grew = 0;
                                    battle.pl = party[lead];
                                    in_battle = 1;
                                    break;
                                case POST_WSOLDIER_MARSH_REED:
                                    battle.foe = mint_monster(TRAINER_KITS[KIT_MARSH_REED].lead_sp, TRAINER_KITS[KIT_MARSH_REED].lead_lv);
                                    battle.wild = 0;
                                    battle.trainer_kind = TRAINER_WSOLDIER_MARSH_REED;
                                    battle.phase = 0;
                                    { int n = s_cat(battle.msg[0], 0, "REEDGUARD SENDS FENWISP");
                                      battle.msg[0][n] = 0; }
                                    battle.msg_n = 1; battle.msg_i = 0; battle.after = BAFTER_ITEM;
                                    battle.cur = 0;
                                    battle.mods_self_str = battle.mods_self_agl = battle.mods_self_spc = 0;
                                    battle.mods_foe_str = battle.mods_foe_agl = battle.mods_foe_spc = 0;
                                    battle.pend_str = battle.pend_agl = battle.pend_spc = 0;
                                    battle.pl_poisoned = battle.foe_poisoned = 0;
                                    battle.bench[0] = mint_monster(TRAINER_KITS[KIT_MARSH_REED].bench_sp[0], TRAINER_KITS[KIT_MARSH_REED].bench_lv[0]);
                                    battle.bench[1] = mint_monster(TRAINER_KITS[KIT_MARSH_REED].bench_sp[1], TRAINER_KITS[KIT_MARSH_REED].bench_lv[1]);
                                    battle.bench_n = TRAINER_KITS[KIT_MARSH_REED].bench_n;
                                    battle.grew = 0;
                                    battle.pl = party[lead];
                                    in_battle = 1;
                                    break;
'''
                  main = main.replace(
                      "                                    in_battle = 1;\n                                    break;\n                                case POST_WSOLDIER_WARDEN:",
                      "                                    in_battle = 1;\n                                    break;\n" + insert + "                                case POST_WSOLDIER_WARDEN:",
                      1,
                  )
              # pending map
              if "NPC_PENDING_OPAL" not in main or "POST_WSOLDIER_OPAL" not in main.split("NPC_PENDING_QUARRY_DRILLER")[-1][:500]:
                  main = main.replace(
                      "else if(npc_pending == NPC_PENDING_QUARRY_DRILLER)\n"
                      "                                    post_action = POST_WSOLDIER_QUARRY_DRILLER;\n",
                      "else if(npc_pending == NPC_PENDING_QUARRY_DRILLER)\n"
                      "                                    post_action = POST_WSOLDIER_QUARRY_DRILLER;\n"
                      "                                else if(npc_pending == NPC_PENDING_OPAL)\n"
                      "                                    post_action = POST_WSOLDIER_OPAL;\n"
                      "                                else if(npc_pending == NPC_PENDING_MARSH_BOG)\n"
                      "                                    post_action = POST_WSOLDIER_MARSH_BOG;\n"
                      "                                else if(npc_pending == NPC_PENDING_MARSH_REED)\n"
                      "                                    post_action = POST_WSOLDIER_MARSH_REED;\n",
                  )
              Path("ports/dreamcast/src/main.c").write_text(main)
              print("main.c patched", main.count("TRAINER_WSOLDIER_OPAL"), main.count("beat_marsh_bog"))

          # CURRENT_WORK
          cw = Path("CURRENT_WORK.md").read_text()
          cw = cw.replace(
              "Dreamcast PENDING dispatch still thin (Claude noted for marsh/opal).",
              "Dreamcast PENDING dispatch for marshBog/marshReed/opal wired (Grok C).",
          )
          if "PENDING dispatch for marsh" not in cw:
              cw += "\n\n## Follow-up\n- Dreamcast PENDING: marshBog, marshReed, opal wired in main.c + bake kit_keys.\n"
          Path("CURRENT_WORK.md").write_text(cw)
          print("done")
          PY
      - name: Rebake content (best effort)
        run: |
          python3 tools/bake_content.py || echo "bake failed (may need full env); source still patched"
      - name: Commit and push
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add tools/bake_content.py ports/dreamcast/src/main.c CURRENT_WORK.md ports/dreamcast/src/content_*.inc || true
          git status
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Dreamcast PENDING: wire marshBog, marshReed, opal (kit + main.c dispatch)"
          git push
