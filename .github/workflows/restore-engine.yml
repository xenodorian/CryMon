name: restore-engine
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Opal sprites and sprites.json entry
        run: |
          python3 << 'PY'
          import base64, json
          from pathlib import Path
          sprites = {
            "opal-1.png": "",
            "opal-2.png": "",
            "opal-3.png": "",
            "opal-4.png": "",
          }
          out = Path("public/sprites/npc")
          out.mkdir(parents=True, exist_ok=True)
          for name, b64s in sprites.items():
              (out / name).write_bytes(base64.b64decode(b64s))
              print("wrote", name, (out / name).stat().st_size)
          sp = Path("content/sprites.json")
          s = json.loads(sp.read_text())
          if "opal" not in s["npcs"]:
              s["npcs"].append("opal")
              sp.write_text(json.dumps(s, indent=2) + "\n")
          print("npcs", s["npcs"][-4:])
          PY
      - name: Commit and push
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add public/sprites/npc/opal-1.png public/sprites/npc/opal-2.png public/sprites/npc/opal-3.png public/sprites/npc/opal-4.png content/sprites.json
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Task 3.8: Opal walk sprites (opal-1..4) + sprites.json"
          git push
