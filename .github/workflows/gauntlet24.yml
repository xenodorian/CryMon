name: Gauntlet 2.4
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup patch + bake
        run: python3 tools/patch_gauntlet_24_cleanup.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add src/game/engine.ts ports/dreamcast/src tools/patch_gauntlet_24_cleanup.py
          git status
          git diff --staged --quiet && echo no changes && exit 0
          git commit -m "Leg 2.4 cleanup: Tamer on catch, credits after Slayer, DC ending/wipe, rebake maps"
          git push
