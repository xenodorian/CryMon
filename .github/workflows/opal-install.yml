name: Install Opal OW frames
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and install
        run: |
          python3 - <<'PY'
          import base64, pathlib
          root = pathlib.Path("public/sprites/npc")
          src = pathlib.Path("tools/opal_frames")
          for i in range(1,5):
              b64 = (src / f"opal-{i}.b64").read_text().strip()
              p = root / f"opal-{i}.png"
              p.write_bytes(base64.b64decode(b64))
              print("wrote", p, p.stat().st_size)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sprites/npc/opal-*.png
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Art: replace Opal walk frames with user-supplied art (1/3 + 2/4 breath)"
          git push
