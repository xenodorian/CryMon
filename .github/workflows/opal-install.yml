name: Install Opal OW frames
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frames
        run: python3 tools/install_opal_frames.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sprites/npc/opal-1.png public/sprites/npc/opal-2.png public/sprites/npc/opal-3.png public/sprites/npc/opal-4.png
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Art: replace Opal walk frames — Frame1 as 1/3, Frame2 as 2/4"
          git push
