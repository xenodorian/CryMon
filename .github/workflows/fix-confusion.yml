name: Fix confusion duration and Wait
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch apply script from tools if present else fail
        run: |
          if [ ! -f tools/apply_confusion_fix.py ]; then
            echo "missing apply script"
            exit 1
          fi
          python3 tools/apply_confusion_fix.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add content/logic.json src/game/types.ts src/game/data.ts src/game/engine.ts ports/dreamcast/src/content_logic.inc ports/dreamcast/src/main.c tools/apply_confusion_fix.py
          git commit -m "Confusion: 1-4 turn duration; Wait skips self-damage roll" || exit 0
          git push
      - name: Deploy Pages
        run: gh workflow run deploy-pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
