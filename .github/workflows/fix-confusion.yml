name: Fix confusion duration and Wait
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply confusion fix
        run: |
          python3 << 'PY'
          from pathlib import Path

          def sub(path, old, new, label):
              p = Path(path)
              t = p.read_text()
              if old not in t:
                  if new[:60] in t:
                      print(label + ': already')
                      return
                  raise SystemExit(label + ': missing')
              p.write_text(t.replace(old, new, 1))
              print(label + ': ok')

          sub('content/logic.json',
              '    "confused": {},',
              '    "confused": { "turnsMin": 1, "turnsMax": 4 },',
              'logic')
          p = Path('content/logic.json')
          t = p.read_text()
          t2 = t.replace(
              "Burned/Poisoned/Confused/Paralyzed persist on the player's own CryMon until their next rest (sleepHeal)",
              "Burned/Poisoned/Paralyzed persist on the player's own CryMon until their next rest (sleepHeal); Confused lasts 1-4 turns then clears (also cleared by rest)")
          if t2 != t:
              p.write_text(t2)
              print('note ok')

          sub('src/game/types.ts',
              '  /** Burned/Paralyzed countdown; unused by Poisoned/Confused. */\n  statusTurns?: number;',
              '  /** Burned/Paralyzed/Confused countdown; unused by Poisoned. */\n  statusTurns?: number;',
              'types')

          sub('src/game/data.ts',
              '''export type StatusEffectsConfig = {
  burned: { hpPercent: number; turnsMin: number; turnsMax: number };
  poisoned: { startPercent: number; stepPercent: number };
  paralyzed: { turnsMin: number; turnsMax: number };
};
export const STATUS_EFFECTS = ((logicJson as { statusEffects?: StatusEffectsConfig }).statusEffects || {
  burned: { hpPercent: 5, turnsMin: 2, turnsMax: 5 },
  poisoned: { startPercent: 1, stepPercent: 1 },
  paralyzed: { turnsMin: 1, turnsMax: 5 },
}) as StatusEffectsConfig;''',
              '''export type StatusEffectsConfig = {
  burned: { hpPercent: number; turnsMin: number; turnsMax: number };
  poisoned: { startPercent: number; stepPercent: number };
  paralyzed: { turnsMin: number; turnsMax: number };
  confused: { turnsMin: number; turnsMax: number };
};
export const STATUS_EFFECTS = ((logicJson as { statusEffects?: StatusEffectsConfig }).statusEffects || {
  burned: { hpPercent: 5, turnsMin: 2, turnsMax: 5 },
  poisoned: { startPercent: 1, stepPercent: 1 },
  paralyzed: { turnsMin: 1, turnsMax: 5 },
  confused: { turnsMin: 1, turnsMax: 4 },
}) as StatusEffectsConfig;''',
              'data')

          sub('src/game/engine.ts',
              '''\t\t} else if (status === "poisoned") {
\t\t\tm.statusTurns = 0;
\t\t\tm.poisonStack = 0;
\t\t} else {
\t\t\tm.statusTurns = 0;
\t\t\tm.poisonStack = 0;
\t\t}''',
              '''\t\t} else if (status === "poisoned") {
\t\t\tm.statusTurns = 0;
\t\t\tm.poisonStack = 0;
\t\t} else if (status === "confused") {
\t\t\tconst e = STATUS_EFFECTS.confused;
\t\t\tm.statusTurns = randI(e.turnsMin, e.turnsMax);
\t\t\tm.poisonStack = 0;
\t\t} else {
\t\t\tm.statusTurns = 0;
\t\t\tm.poisonStack = 0;
\t\t}''',
              'inflict')

          sub('src/game/engine.ts',
              '''\t\tif (m.status === "paralyzed") {
\t\t\tm.statusTurns = (m.statusTurns ?? 1) - 1;
\t\t\tif (m.statusTurns <= 0) this.clearStatus(m);
\t\t\treturn "";
\t\t}
\t\treturn "";
\t}''',
              '''\t\tif (m.status === "paralyzed") {
\t\t\tm.statusTurns = (m.statusTurns ?? 1) - 1;
\t\t\tif (m.statusTurns <= 0) this.clearStatus(m);
\t\t\treturn "";
\t\t}
\t\tif (m.status === "confused") {
\t\t\tm.statusTurns = (m.statusTurns ?? 1) - 1;
\t\t\tif (m.statusTurns <= 0) this.clearStatus(m);
\t\t\treturn "";
\t\t}
\t\treturn "";
\t}''',
              'tick')

          sub('src/game/engine.ts',
              '''\t\t// Paralysis/confusion intercept before the chosen move even runs --
\t\t// the turn-countdown/HP-tick itself happens once per round in
\t\t// resolve_guard, not here, so this only checks and bypasses.
\t\tif (b.player.status === "paralyzed") {
\t\t\tb.pendingDmg = 0;
\t\t\tb.pendingLabel = `${b.player.name} is paralyzed and can't move.`;
\t\t\tb.phase = "resolve_hit";
\t\t\tthis.audio.miss();
\t\t\treturn;
\t\t}
\t\tconst confused = this.confusionOutcome(b.player, true);''',
              '''\t\t// Paralysis/confusion intercept before the chosen move even runs --
\t\t// the turn-countdown/HP-tick itself happens once per round in
\t\t// resolve_guard, not here, so this only checks and bypasses.
\t\t// Wait intentionally skips confusion self-hit: safe play while confused
\t\t// (duration still ticks via tickStatus).
\t\tif (mv.kind === "wait") {
\t\t\tb.msg = [`${b.player.name} holds.`];
\t\t\tb.msgI = 0;
\t\t\tb.phase = "msg";
\t\t\tb.afterMsg = "guard";
\t\t\tthis.audio.ui();
\t\t\treturn;
\t\t}
\t\tif (b.player.status === "paralyzed") {
\t\t\tb.pendingDmg = 0;
\t\t\tb.pendingLabel = `${b.player.name} is paralyzed and can't move.`;
\t\t\tb.phase = "resolve_hit";
\t\t\tthis.audio.miss();
\t\t\treturn;
\t\t}
\t\tconst confused = this.confusionOutcome(b.player, true);''',
              'wait-first')

          t = Path('src/game/engine.ts').read_text()
          dup = '''\t\tif (mv.kind === "wait") {
\t\t\tb.msg = [`${b.player.name} holds.`];
\t\t\tb.msgI = 0;
\t\t\tb.phase = "msg";
\t\t\tb.afterMsg = "guard";
\t\t\tthis.audio.ui();
\t\t\treturn;
\t\t}
\t\tif (mv.kind === "spell") {'''
          if dup in t:
              Path('src/game/engine.ts').write_text(t.replace(dup, '\t\tif (mv.kind === "spell") {', 1))
              print('dup wait removed')

          sub('ports/dreamcast/src/content_logic.inc',
              '''#define STATUS_PARALYZE_TURNS_MIN 1\n#define STATUS_PARALYZE_TURNS_MAX 5\n''',
              '''#define STATUS_PARALYZE_TURNS_MIN 1\n#define STATUS_PARALYZE_TURNS_MAX 5\n#define STATUS_CONFUSE_TURNS_MIN 1\n#define STATUS_CONFUSE_TURNS_MAX 4\n''',
              'dc-inc')

          sub('ports/dreamcast/src/main.c',
              '''static void inflict_status(Monster *m, int status) {\n    m->status = status;\n    m->poison_stack = 0;\n    if(status == STATUS_BURNED) m->status_turns = irand(STATUS_BURN_TURNS_MIN, STATUS_BURN_TURNS_MAX);\n    else if(status == STATUS_PARALYZED) m->status_turns = irand(STATUS_PARALYZE_TURNS_MIN, STATUS_PARALYZE_TURNS_MAX);\n    else m->status_turns = 0;\n}''',
              '''static void inflict_status(Monster *m, int status) {\n    m->status = status;\n    m->poison_stack = 0;\n    if(status == STATUS_BURNED) m->status_turns = irand(STATUS_BURN_TURNS_MIN, STATUS_BURN_TURNS_MAX);\n    else if(status == STATUS_PARALYZED) m->status_turns = irand(STATUS_PARALYZE_TURNS_MIN, STATUS_PARALYZE_TURNS_MAX);\n    else if(status == STATUS_CONFUSED) m->status_turns = irand(STATUS_CONFUSE_TURNS_MIN, STATUS_CONFUSE_TURNS_MAX);\n    else m->status_turns = 0;\n}''',
              'dc-inflict')

          sub('ports/dreamcast/src/main.c',
              '''    if(m->status == STATUS_PARALYZED) {\n        m->status_turns--;\n        if(m->status_turns <= 0) clear_status(m);\n        return n;\n    }\n    return n;\n}''',
              '''    if(m->status == STATUS_PARALYZED) {\n        m->status_turns--;\n        if(m->status_turns <= 0) clear_status(m);\n        return n;\n    }\n    if(m->status == STATUS_CONFUSED) {\n        m->status_turns--;\n        if(m->status_turns <= 0) clear_status(m);\n        return n;\n    }\n    return n;\n}''',
              'dc-tick')

          sub('ports/dreamcast/src/main.c',
              '''                    else if(battle.phase == 2) {\n                        UMove moves[UMOVE_MAX];\n                        int mn = unlocked_moves(&battle.pl, 1, moves, UMOVE_MAX);\n                        const UMove *mv = (battle.cur >= 0 && battle.cur < mn) ? &moves[battle.cur] : 0;\n                        if(battle_pl_status_intercept(&battle, party, party_n, lead)) {\n                            /* paralyzed/confused -- handled inside, turn used */\n                        } else if(!mv) {\n                            /* empty */\n                        } else if(mv->kind == UMOVE_WAIT) {\n                            int n = s_cat(battle.msg[0], 0, g_player_name);\n                            n = s_cat(battle.msg[0], n, " HOLDS");\n                            battle.msg[0][n] = 0;\n                            battle.msg_n = 1;\n                            battle.msg_i = 0;\n                            battle.phase = 0;\n                            battle.after = BAFTER_GUARD;\n                        } else if(mv->kind == UMOVE_SPELL) {''',
              '''                    else if(battle.phase == 2) {\n                        UMove moves[UMOVE_MAX];\n                        int mn = unlocked_moves(&battle.pl, 1, moves, UMOVE_MAX);\n                        const UMove *mv = (battle.cur >= 0 && battle.cur < mn) ? &moves[battle.cur] : 0;\n                        if(mv && mv->kind == UMOVE_WAIT) {\n                            if(battle.pl.status == STATUS_PARALYZED) {\n                                if(battle_pl_status_intercept(&battle, party, party_n, lead)) { }\n                            } else {\n                                int n = s_cat(battle.msg[0], 0, g_player_name);\n                                n = s_cat(battle.msg[0], n, " HOLDS");\n                                battle.msg[0][n] = 0;\n                                battle.msg_n = 1;\n                                battle.msg_i = 0;\n                                battle.phase = 0;\n                                battle.after = BAFTER_GUARD;\n                            }\n                        } else if(battle_pl_status_intercept(&battle, party, party_n, lead)) {\n                            /* paralyzed/confused -- handled inside, turn used */\n                        } else if(!mv) {\n                            /* empty */\n                        } else if(mv->kind == UMOVE_SPELL) {''',
              'dc-wait')

          print('ALL DONE')
          PY
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add content/logic.json src/game/types.ts src/game/data.ts src/game/engine.ts ports/dreamcast/src/content_logic.inc ports/dreamcast/src/main.c
          git commit -m "Confusion: 1-4 turn duration; Wait skips self-damage roll" || exit 0
          git push
      - name: Deploy Pages
        run: gh workflow run deploy-pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
