name: Fix confusion duration + wait
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply confusion fix
        run: python3 tools/patch_confusion.py
      - name: Commit
        run: |
          git config user.name "Grok C"
          git config user.email "76492590+xenodorian@users.noreply.github.com"
          git add src/game/engine.ts src/game/data.ts tools/patch_confusion.py
          git commit -m "Confusion: 1-4 turn duration; Wait skips self-damage roll" || exit 0
          git push
      - name: Deploy Pages
        run: gh workflow run deploy-pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
